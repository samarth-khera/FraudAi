# Render Blueprint for the FraudShield AI backend (free plan, read-only public demo).
#
# The filesystem of a Render web service is ephemeral. Nothing here needs to persist: the synthetic ledger and
# models are rebuilt/fetched at build time, and the case database is re-seeded on every start. Public writes are
# disabled (ENVIRONMENT=production without an API key -> write endpoints return 503), so no user data is stored.
services:
  - type: web
    name: fraudshield-api
    runtime: python
    plan: free
    branch: v2-rebuild
    buildCommand: bash scripts/render_build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_API_DOCS
        value: "false"
      # Set to the deployed Vercel URL (no trailing slash) after the frontend exists.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Optional AI analyst (docs/AI_ANALYST.md). Set GEMINI_API_KEY and GEMINI_ANALYST_ENABLED=true in the dashboard;
      # model, timeout and privacy policy have safe defaults.
